services:
  ai-chat-backend:
    build: ./backend
    container_name: ai-chat-backend
    ports:
      - "8987:5000"
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - TZ=Asia/Shanghai
